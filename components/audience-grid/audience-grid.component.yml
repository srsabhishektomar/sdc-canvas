$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Audience Card Grid
status: stable
group: Container
description: A configurable responsive grid for audience cards.
libraryOverrides:
  dependencies:
    - sdc_canvas/global
props:
  type: object
  properties:
    columns:
      type: integer
      title: Desktop columns
      enum:
        - 1
        - 2
        - 3
        - 4
      default: 4
      examples:
        - 4
slots:
  cards:
    title: Audience cards
    description: Audience card components arranged in the grid.
    examples:
      - <p>Example audience card</p>
