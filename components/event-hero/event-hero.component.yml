$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Event Hero
status: stable
group: Marketing/Hero
description: Configurable event hero with copy, metadata, and media.
libraryOverrides:
  dependencies:
    - sdc_canvas/global
props:
  type: object
  required:
    - title
  properties:
    eyebrow:
      type: string
      title: Eyebrow
      examples:
        - People. Products. A brighter food future.
    title:
      type: string
      title: Event title
      examples:
        - "Winter\nFancyFaire* 2028"
    description:
      type: string
      title: Description
      examples:
        - "Join the specialty food community to kick off 2027 in one of the world's greatest food cities: San Francisco. Elevate your trade show experience with onsite sampling, unstructured networking, and local immersion."
    date_label:
      type: string
      title: Date label
      examples:
        - January 17–19, 2027
    location_label:
      type: string
      title: Location label
      examples:
        - "Moscone Center\nSan Francisco, CA"
    image_url:
      type: object
      $ref: json-schema-definitions://canvas.module/image
      title: Hero image
slots:
  actions:
    title: Actions
    description: Add one or more Button components for the hero calls to action.
